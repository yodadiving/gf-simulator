<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024" role="img" aria-label="Petite mascotte verte aux grandes oreilles, équipée d'un masque et d'un détendeur de plongée">
  <defs>
    <radialGradient id="eau" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#2FA3B0"/>
      <stop offset="1" stop-color="#0B2E40"/>
    </radialGradient>
    <linearGradient id="verre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F6FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9FD0F5" stop-opacity=".22"/>
    </linearGradient>
    <clipPath id="rond"><circle cx="256" cy="256" r="244"/></clipPath>
  </defs>

  <!-- fond : eau -->
  <circle cx="256" cy="256" r="244" fill="url(#eau)"/>
  <g clip-path="url(#rond)">
    <path d="M0 120 C90 100 160 140 256 120 S430 100 512 124 V0 H0 Z" fill="#fff" opacity=".07"/>
    <!-- bulles -->
    <g fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="4">
      <circle cx="338" cy="150" r="11"/><circle cx="364" cy="112" r="7"/><circle cx="326" cy="92" r="5"/>
      <circle cx="402" cy="170" r="6"/><circle cx="120" cy="150" r="8"/><circle cx="96" cy="112" r="5"/>
    </g>

    <!-- bouteille, derrière le personnage -->
    <rect x="344" y="322" width="50" height="170" rx="22" fill="#E8A53C"/>
    <rect x="344" y="372" width="50" height="14" fill="#BD5C17" opacity=".7"/>
    <rect x="360" y="306" width="18" height="24" rx="5" fill="#9AA7B0"/>
    <circle cx="369" cy="312" r="13" fill="#C8D3DA" stroke="#2b3a45" stroke-width="4"/>

    <!-- oreilles -->
    <path d="M168 232 C122 206 70 196 26 206 C58 252 112 282 172 286 Z" fill="#8FB071"/>
    <path d="M160 238 C124 222 86 216 56 220 C84 246 120 262 162 268 Z" fill="#E7B7A6"/>
    <path d="M344 232 C390 206 442 196 486 206 C454 252 400 282 340 286 Z" fill="#8FB071"/>
    <path d="M352 238 C388 222 426 216 456 220 C428 246 392 262 350 268 Z" fill="#E7B7A6"/>

    <!-- corps : tenue de plongée sombre + manteau -->
    <path d="M160 338 C160 304 352 304 352 338 L384 500 L128 500 Z" fill="#B58A5B"/>
    <path d="M200 316 L256 372 L312 316 L338 330 L256 396 L174 330 Z" fill="#8C6540"/>
    <rect x="152" y="420" width="208" height="16" fill="#6E4D2F" opacity=".85"/>
    <!-- mains -->
    <ellipse cx="212" cy="404" rx="17" ry="14" fill="#9DBD7E"/>
    <ellipse cx="300" cy="404" rx="17" ry="14" fill="#9DBD7E"/>

    <!-- tête -->
    <ellipse cx="256" cy="236" rx="98" ry="88" fill="#A8C686"/>
    <ellipse cx="256" cy="262" rx="70" ry="44" fill="#B9D49C" opacity=".6"/>

    <!-- sangle du masque -->
    <path d="M178 238 C168 238 160 240 156 244 M334 238 C344 238 352 240 356 244" stroke="#12202b" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- yeux -->
    <ellipse cx="222" cy="236" rx="21" ry="25" fill="#1b1b1b"/>
    <ellipse cx="290" cy="236" rx="21" ry="25" fill="#1b1b1b"/>
    <circle cx="229" cy="227" r="7" fill="#fff"/><circle cx="297" cy="227" r="7" fill="#fff"/>
    <circle cx="217" cy="246" r="3.5" fill="#fff" opacity=".8"/><circle cx="285" cy="246" r="3.5" fill="#fff" opacity=".8"/>

    <!-- verre + cadre du masque -->
    <rect x="178" y="198" width="156" height="84" rx="36" fill="url(#verre)"/>
    <path d="M196 208 C210 202 226 202 238 206" stroke="#fff" stroke-opacity=".75" stroke-width="6" stroke-linecap="round" fill="none"/>
    <rect x="178" y="198" width="156" height="84" rx="36" fill="none" stroke="#12202b" stroke-width="12"/>
    <path d="M232 280 C240 292 272 292 280 280" stroke="#12202b" stroke-width="10" stroke-linecap="round" fill="none"/>

    <!-- bouche + détendeur -->
    <path d="M238 302 C248 308 264 308 274 302" stroke="#5b7a47" stroke-width="4" stroke-linecap="round" fill="none"/>
    <rect x="238" y="292" width="36" height="22" rx="9" fill="#2b3a45"/>
    <circle cx="256" cy="318" r="24" fill="#C8D3DA" stroke="#2b3a45" stroke-width="6"/>
    <circle cx="256" cy="318" r="11" fill="#2b3a45"/>
    <circle cx="256" cy="318" r="4.5" fill="#E8A53C"/>
    <!-- flexible vers la bouteille -->
    <path d="M280 322 C326 342 336 296 368 312" stroke="#2b3a45" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4"/>
</svg>
